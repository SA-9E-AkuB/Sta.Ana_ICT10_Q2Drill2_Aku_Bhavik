<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Directory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background: #101014;
            color: white;
            font-family: Arial, sans-serif;
        }

        .hero {
            padding: 45px 7% 25px;
        }

        h1 {
            font-size: 55px;
            font-weight: bold;
        }

        h1 span {
            color: #bd91ff;
        }

        .panel {
            background: #1b1b23;
            border: 1px solid #30303c;
            border-radius: 12px;
            padding: 22px;
            height: 100%;
        }

        .form-control {
            background: #111117;
            color: white;
            border: 1px solid #3b3b49;
            padding: 12px;
            margin-bottom: 12px;
        }

        .form-control:focus {
            background: #111117;
            color: white;
            border-color: #bd91ff;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #9999a8;
        }

        .btn-purple {
            background: #bd91ff;
            color: #15101e;
            font-weight: bold;
            width: 100%;
            padding: 11px;
        }

        .btn-purple:hover {
            background: #d1b5ff;
        }

        #results {
            color: #d8baff;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        .count {
            background: #292035;
            color: #d8baff;
            padding: 14px;
            border-radius: 10px;
            margin-top: 18px;
        }

        #total {
            font-size: 30px;
            font-weight: bold;
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

    <header class="hero">
        <h1>Artist <span>Directory.</span></h1>
    </header>

    <main class="container-fluid px-4 px-md-5 pb-5">
        <div class="row g-4">

            <div class="col-lg-4">
                <div class="panel">
                    <h3>Add New Artist</h3>

                    <input id="first_name" class="form-control"
                        placeholder="First name">

                    <input id="last_name" class="form-control"
                        placeholder="Last name">

                    <button class="btn btn-purple"
                        py-click="add_artist">Add Artist +</button>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="panel">
                    <h3>All Artists</h3>
                    <div id="results">Loading...</div>

                    <div class="count d-flex justify-content-between align-items-center">
                        Total Members
                        <span id="total">0</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script type="py">
from pyscript import document

# giving each sets, thier own names 
grade7 = {"Drake", "The Weeknd", "Bruno Mars", "Ariana Grande"}
grade8 = {"Kendrick Lamar", "Billie Eilish", "Lana Del Rey", "SZA"}
grade9 = {"The Beatles", "The Neighbourhood", "Arctic Monkeys", "Radiohead"}
grade10 = {"Tyler, The Creator", "Frank Ocean", "Taylor Swift", "Sabrina Carpenter"}

# this adds all the sets tgt into one big set while using the union operator
master_set = grade7 | grade8 | grade9 | grade10

# we use this to update the HTML screen with the list and count
def update_display():
    document.getElementById("results").innerHTML = f"{'<br>'.join(sorted(master_set))}"
    document.getElementById("total").innerHTML = f"{len(master_set)}"

# it happens when the button is clicked to add a new artist from the text boxes
def add_artist(event):
    global master_set

    first = document.getElementById("first_name").value.strip()
    last = document.getElementById("last_name").value.strip()
    new_artist = f"{first} {last}".strip()

    master_set = master_set | {new_artist}
    update_display()

    document.getElementById("first_name").value = ""
    document.getElementById("last_name").value = ""

update_display()
    </script>

</body>
</html>
